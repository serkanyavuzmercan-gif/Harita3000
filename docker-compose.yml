services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: harita
      POSTGRES_PASSWORD: harita
      POSTGRES_DB: harita3000
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql

volumes:
  pgdata:
